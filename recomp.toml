# gba_recompile base config for Grand Theft Auto Advance (BGTE, USA).
# Schema: ../../DukeAdvance/gbarecomp/docs/TOML_SCHEMA.md. Machine-found seeds
# live in the overlay recomp_scan.toml (tools/scan_seeds.py).

[program]
name         = "Grand Theft Auto Advance"
id           = "gtaadvance"
load_address = 0x08000000
size         = 0x01000000
entry_pc     = 0x08000000
# Executable part of the cartridge: crt0 through the last libc routine.
# Thumb 0x08000220-0x08067000, ARM 0x08067000-0x0806B500, Thumb to 0x08071C00;
# everything after is data.
aot_scan_start = 0x080000C0
aot_scan_end   = 0x08071C00

[identity]
sha1 = "742fc0062ad930253ffea449953061381577649e"

[[extra_func]]
addr = 0x080000C0
mode = "arm"
name = "crt0_start"
note = "target of the header branch at 0x08000000"

[[extra_func]]
addr = 0x08000104
mode = "arm"
name = "irq_dispatch"
note = "crt0 stores this address at 0x03007FFC; handler table at 0x02000170"

[[extra_func]]
addr = 0x08066554
mode = "thumb"
name = "link_serial_irq"
note = "the link's serial interrupt handler; nothing in the shipped game calls it (see src/main.cpp)"

[[extra_func]]
addr = 0x08000430
mode = "thumb"
name = "main"
note = "crt0 literal at 0x08000100"

# ---- routines the game copies into IWRAM --------------------------------
# The loader at 0x08011C00.. walks the table at 0x08CA4164 ({EWRAM pointer
# variable, ROM start, ROM end} x 12) and copies each ARM routine into IWRAM,
# storing where it landed. The two sound mixer routines (ROM 0x0806B090 and
# 0x0806B298, literal pool at 0x08033248) are copied the same way. Addresses
# below were observed in gameplay (renderer + mixer) and on the title screen
