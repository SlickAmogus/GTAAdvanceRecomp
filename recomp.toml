# Widescreen (src/scene_host.cpp). The camera code derives the visible
# rectangle from the camera height; its left and right edges (IWRAM
# 0x03000050 / 0x03000058) decide which people and cars get a sprite, and
# sprite screen columns are measured from the left edge. It is computed in
# two places: 0x0800A130, called by the per-frame camera routines at
# 0x08009058 and 0x080098DA, and 0x08008BC4 when the camera is placed
# directly. The function called immediately after each of those is hooked,
# observed only: 0x08009832 and 0x0800A0C0 (the calls that follow 0x0800A130)
# and 0x08010110 (the last call of 0x08008BC4). While the native renderer
# shows a picture wider than 3:2 the hook widens the rectangle. The hooked
# functions always run unchanged.
# The cut link-cable multiplayer: the interrupt dispatcher has no serial case.
# See serial_match_hook in src/main.cpp.
[[mod_function_hook]]
addr = 0x080001AC
mode = "arm"
note = "IRQ dispatcher after the source match: serial given its own slot"

[[mod_function_hook]]
addr = 0x08000734
mode = "thumb"
note = "empty IRQ handler: continues into the serial handler 0x08066554 for that slot"

# The ONLINE menu (src/online/online_ui.cpp).
[[mod_function_hook]]
addr = 0x0805E330
mode = "thumb"
note = "string lookup: the new ONLINE label's id answered with its text"

[[mod_function_hook]]
addr = 0x08065E5C
mode = "thumb"
note = "link handshake: ONLINE on the title menu opens the online menu instead"

[[mod_function_hook]]
addr = 0x08009832
mode = "thumb"
note = "runs right after the visible rectangle is computed: widened for widescreen (observed only)"

[[mod_function_hook]]
addr = 0x0800A0C0
mode = "thumb"
note = "same, second camera routine (observed only)"

[[mod_function_hook]]
addr = 0x08010110
mode = "thumb"
note = "same, after a direct camera placement (observed only)"

# 0x08014650 is "cmp r0, #0xF0" in 0x08014500: a sprite whose left edge is
# beyond column 240 is released. With the rectangle widened, columns run past
# 240, so the limit takes the widened width. Unchanged while the hook is off.
[[thumb_alu_immediate_override]]
addr = 0x08014650
note = "sprite right-edge limit follows the widened picture"

# Native renderer (src/scene_host.cpp). 0x0800D2B0 draws the building layer.
# 0x0800E3E4 is the call right after it sorts the instance list: observed
# only, the renderer copies the list there while it is whole. 0x0800FDEC
# (transform one instance's faces into a display list) and 0x0800DB64
# (rasterise that list) only produce pixels of the building layer; while the
# native renderer is on they are skipped, which is what lets the game finish
# a frame every display refresh. With the hook off or declining they run
# unchanged.
[[mod_function_hook]]
addr = 0x0800E3E4
mode = "thumb"
note = "after the instance list is sorted: list copied for the native renderer (observed only)"

[[mod_function_hook]]
addr = 0x0800FDEC
mode = "thumb"
note = "per-instance face transform: skipped under the native renderer"

[[mod_function_hook]]
addr = 0x0800DB64
mode = "thumb"
note = "per-instance display list rasteriser: skipped under the native renderer"

# Smooth motion (src/scene_host.cpp). 0x080127EC copies a finished world
# tick's sprite list to hardware OAM; the vertical-blank handler calls it
# first when it flips the picture. Observed only: the renderer latches the
# camera that belongs to those sprites there, so it can show states between
# two ticks. The function always runs.
[[mod_function_hook]]
addr = 0x080127EC
mode = "thumb"
note = "picture flip: camera latched with the tick's sprites (observed only)"
